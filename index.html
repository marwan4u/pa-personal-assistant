<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="PA Personal Assistant helps manage reminders, documents, emails, tasks and everyday personal activities.">
  <title>PA Personal Assistant</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f7f8fa;color:#17202a}
    main{min-height:100vh;display:grid;place-items:center;padding:28px}.card{max-width:760px;width:100%;background:#fff;border:1px solid #e7e9ee;border-radius:24px;padding:56px;box-shadow:0 18px 55px rgba(0,0,0,.07)}
    .mark{width:58px;height:58px;border-radius:16px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;margin-bottom:28px}
    h1{font-size:clamp(34px,6vw,56px);line-height:1.04;margin:0 0 18px;letter-spacing:-.04em}p{font-size:19px;line-height:1.65;color:#55606e;margin:0}
    .rule{height:1px;background:#eceef2;margin:36px 0}.small{font-size:14px;color:#7a8491}.pill{display:inline-block;margin-top:28px;padding:9px 14px;border-radius:999px;background:#f1f3f6;font-size:14px;font-weight:600;color:#394452}
    @media(max-width:600px){.card{padding:34px 26px;border-radius:20px}p{font-size:17px}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="mark">PA</div>
    <h1>PA Personal Assistant</h1>
    <p>A personal AI assistant designed to help manage reminders, documents, emails, tasks and everyday personal activities through a simple conversational experience.</p>
    <span class="pill">Personal productivity & automation</span>
    <div class="rule"></div>
    <p class="small">PA Personal Assistant · Qatar</p>
  </section>
</main>
</body>
</html>
